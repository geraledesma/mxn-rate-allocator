<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>v2 — Comparación Desktop vs Móvil</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a2e; font-family: system-ui, sans-serif; }
  header {
    padding: 12px 24px;
    color: #fff;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 16px;
    background: #16213e;
    border-bottom: 1px solid #0f3460;
  }
  header strong { color: #e2b96f; }
  .label {
    background: #0f3460;
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 11px;
    color: #a8c0e8;
  }
  .stage {
    display: flex;
    gap: 24px;
    padding: 24px;
    height: calc(100vh - 45px);
    align-items: flex-start;
    justify-content: center;
  }
  .col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    height: 100%;
  }
  .badge {
    color: #a8c0e8;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .05em;
    text-transform: uppercase;
  }
  .frame-wrap {
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 8px 40px rgba(0,0,0,.6);
    flex: 1;
    min-height: 0;
  }
  .frame-desktop {
    width: 900px;
  }
  .frame-mobile {
    width: 390px;
    position: relative;
  }
  /* phone chrome */
  .phone-chrome {
    background: #111;
    border-radius: 40px;
    padding: 14px 10px;
    box-shadow: 0 0 0 2px #333, 0 20px 60px rgba(0,0,0,.8);
  }
  .phone-notch {
    width: 100px;
    height: 24px;
    background: #111;
    border-radius: 0 0 16px 16px;
    margin: 0 auto 6px;
    position: relative;
    z-index: 2;
  }
  .phone-screen {
    border-radius: 28px;
    overflow: hidden;
    background: #fff;
  }
  iframe {
    display: block;
    border: none;
    width: 100%;
  }
  .iframe-desktop { height: 680px; }
  .iframe-mobile  { height: 640px; }
</style>
</head>
<body>
<header>
  <strong>Merqurio /v2</strong>
  <span class="label">Desktop — 900px</span>
  <span style="color:#555">vs</span>
  <span class="label">Móvil — 390px</span>
</header>

<div class="stage">
  <!-- Desktop -->
  <div class="col">
    <span class="badge">Desktop</span>
    <div class="frame-wrap frame-desktop">
      <iframe class="iframe-desktop" src="/v2" title="desktop"></iframe>
    </div>
  </div>

  <!-- Mobile (phone chrome) -->
  <div class="col">
    <span class="badge">Móvil · iPhone 14</span>
    <div class="phone-chrome">
      <div class="phone-notch"></div>
      <div class="phone-screen" style="width:370px;">
        <iframe class="iframe-mobile" src="/v2" title="mobile"
          id="mobileFrame"></iframe>
      </div>
    </div>
  </div>
</div>

<script>
// Inject mobile-simulation styles into the mobile iframe once loaded
document.getElementById('mobileFrame').addEventListener('load', function() {
  try {
    const doc = this.contentDocument;
    const s = doc.createElement('style');
    s.textContent = `
      .nav-links { display: none !important; }
      .nav-toggle { display: flex !important; }
      .wiz-shell { height: calc(100dvh - 56px) !important; padding: 0 !important; }
      .wiz-card {
        display: flex !important; flex-direction: column !important;
        flex: 1 !important; background: transparent !important;
        border-radius: 0 !important; box-shadow: none !important;
        overflow: visible !important;
      }
      .wiz-panels { min-height: 0 !important; }
      .wiz-footer { padding: 0.75rem 1rem !important; }
    `;
    doc.head.appendChild(s);
  } catch(e) { console.warn('iframe injection blocked:', e); }
});
</script>
</body>
</html>
