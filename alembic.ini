# Alembic config for the rate-allocator persistence layer.
#
# The DB URL is intentionally left empty here; env.py reads it at runtime
# from RATE_ALLOCATOR_DB_URL (default: sqlite:///data/rates.db) so the same
# config file works for local dev (SQLite) and any deployed Postgres.

[alembic]
script_location = src/rate_allocator/persistence/migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
