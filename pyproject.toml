[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rate-allocator"
version = "0.1.0"
description = "Optimal cash allocation across SOFIPOs and Mexican banks with tiered interest rates"
readme = "README.md"
license = { text = "BUSL-1.1" }
requires-python = ">=3.10"
dependencies = [
    "scipy>=1.10.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
]

[project.scripts]
rate-scrape         = "rate_allocator.cli.scrape:main"
rate-scrape-primary = "rate_allocator.cli.scrape_primary:main"
rate-ingest         = "rate_allocator.cli.ingest:main"
rate-seed           = "rate_allocator.cli.seed:main"
rate-web            = "rate_allocator.web.app:run"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "httpx>=0.27",
]
notebook = [
    "jupyter>=1.0.0",
    "ipython>=8.0.0",
    "ipywidgets>=8.0.0",
    "matplotlib>=3.7.0",
]
streamlit = [
    "streamlit>=1.28.0",
    "matplotlib>=3.7.0",
    "pandas>=2.0.0",
]
scraper = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pdfplumber>=0.11",
]
postgres = [
    "psycopg[binary]>=3.1",
]
web = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.0",
    "aiofiles>=23.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py39"
