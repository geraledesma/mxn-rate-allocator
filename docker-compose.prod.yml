services:
  merqurio:
    build: .
    image: merqurio:latest
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      # Replace merqurio.mx with actual domain once registered (MXN-006)
      - "traefik.http.routers.merqurio.rule=Host(`merqurio.mx`)"
      - "traefik.http.routers.merqurio.entrypoints=websecure"
      - "traefik.http.routers.merqurio.tls.certresolver=letsencrypt"
      - "traefik.http.services.merqurio.loadbalancer.server.port=8000"
    networks:
      - traefik_proxy  # Verify name: `docker network ls` on VPS

networks:
  traefik_proxy:
    external: true
    # Typical names: traefik_proxy, traefik_web, proxy, traefik
    # Check with: docker network ls | grep traefik
