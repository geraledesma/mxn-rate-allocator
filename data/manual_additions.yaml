# Institutions not listed on tasas.mx — manually curated.
#
# REGLA: La tasa que entra al DB es siempre la tasa NOMINAL del T&C oficial.
# Nunca usar el GAT ni el valor del homepage como fuente de tasa.
#
# FORMATO: institutions con un solo plan usan shorthand "tiers:" directamente.
# Institutions con múltiples planes usan la clave "plans:".

institutions:

  # ── PLATA ────────────────────────────────────────────────────────────────────
  # Fuente T&C: https://prime.platacard.mx/file-service/static/eula/ahorro_flexible_booklet.pdf
  # "Banco Plata S.A., Institución de Banca Múltiple" (CNBV dic 2024) — cobertura IPAB.
  # Tasas nominales jul 2026:
  #   Ahorro Flexible sin Plata+:  7% sin límite — sin costo adicional
  #   Ahorro Flexible con Plata+: 10% sin límite — membresía $114.84/mes ($99+IVA)
  # Break-even: $114.84*12 / (0.10-0.07) ≈ $45,936 MXN
  - name: Plata
    institution_type: banco
    plans:
      - plan_key: base
        display_name: Plata Ahorro Flexible
        monthly_cost: 0
        tiers:
          - limit: .inf
            rate: 0.07

      - plan_key: plus
        display_name: "Plata Ahorro Flexible Plata+"
        monthly_cost: 114.84  # membresía $99+IVA/mes
        tiers:
          - limit: .inf
            rate: 0.10
            constraints:
              - type: monthly_expense
                cost: 114.84
                benefit: membership_plan
                condition_value: 114.84
                active: true

  # ── KLAR ─────────────────────────────────────────────────────────────────────
  # Fuente: https://www.klar.mx/inversion (jul 2026)
  # "Klar México, S.A. de C.V., Sociedad Financiera Popular" (CNBV) — cobertura Prosofipo.
  # Tasas nominales a la vista (cuenta líquida):
  #   Light (sin suscripción): 3.0% — sin costo mensual
  #   Plus (suscripción): 5.0% — costo mensual PENDIENTE verificar klar.mx
  #   Platino (suscripción): 5.0% — costo mensual PENDIENTE verificar klar.mx
  # Nota: tasas.mx mostraba 8.5% agrupado — era tasa para plazo fijo, no a la vista.
  - name: Klar
    institution_type: sofipo
    plans:
      - plan_key: light
        display_name: Klar Light
        monthly_cost: 0
        tiers:
          - limit: .inf
            rate: 0.03

      - plan_key: plus
        display_name: Klar Plus
        monthly_cost: 0  # PENDIENTE: verificar precio en klar.mx
        tiers:
          - limit: .inf
            rate: 0.05

      - plan_key: platino
        display_name: Klar Platino
        monthly_cost: 0  # PENDIENTE: verificar precio en klar.mx
        tiers:
          - limit: .inf
            rate: 0.05

  # ── UALA ─────────────────────────────────────────────────────────────────────
  # Fuente: https://www.uala.mx/tyc-uala-cuenta-con-rendimiento-plus (T&C V9)
  # "Ualá S.A., Institución de Banca Múltiple" — cobertura IPAB.
  # Tasas nominales jul 2026:
  #   Tasa Base:      6.75% hasta $30k — sin condición (decero confirma jul 2026)
  #   Tasa Plus:      12%   hasta $30k — gasto ≥$3,000/mes (T&C cl. 5.2)
  #   Tasa Plus alta: 15%   hasta $30k — gasto ≥$6,000/mes (T&C cl. 5.3)
  #   Excedente: sin rendimiento (T&C cl. 6.3)
  # Modelo: los 3 modos son alternativos (no acumulados). Se modelan como
  # tramos con constraints hasta que el engine soporte condition_tiers nativos.
  - name: Uala
    institution_type: banco
    tiers:
      - limit: 30_000
        rate: 0.0675  # Tasa Base — sin condición
      - limit: 30_000
        rate: 0.12    # Tasa Plus — requiere gasto ≥$3,000/mes
        constraints:
          - type: monthly_expense
            cost: 3000.0
            benefit: mid_rate_tier
            condition_value: 3000.0
            active: true
      - limit: 30_000
        rate: 0.15    # Tasa Plus alta — requiere gasto ≥$6,000/mes
        constraints:
          - type: monthly_expense
            cost: 6000.0
            benefit: high_rate_tier
            condition_value: 6000.0
            active: true
      - limit: .inf
        rate: 0.0     # Excedente sin rendimiento

  # ── STORI ────────────────────────────────────────────────────────────────────
  # Fuente: https://www.storicard.com/files/stori-cuentamas/folleto-informativo-depositos.pdf?v=20260113
  # "Stori México, S.A. de C.V., Sociedad Financiera Popular" — cobertura Prosofipo.
  # Tasa nominal Cuenta+ a la vista: ~6.77% (GAT Nominal 7.00%, may 2026)
  - name: Stori
    institution_type: sofipo
    tiers:
      - limit: .inf
        rate: 0.0677

  # ── FINSUS ───────────────────────────────────────────────────────────────────
  # Fuente: https://finsus.mx/faqs-items/cuales-son-las-tasas-que-manejan-en-cuenta-de-ahorro-y-en-inversion/
  # "Financiera Sustentable de México, S.A. de C.V., S.F.P." (CNBV) — cobertura Prosofipo.
  # ⚠️ EN REVISIÓN — tasa a la vista no confirmada. Fuentes contradictorias:
  #   AI jul 2026: "4% anual a la vista" | Otra fuente: "6-7.5% liquidez inmediata (¿Finsus+?)"
  #   tasas.mx solo muestra plazos fijos — FUERA DE ALCANCE.
  # TODO: confirmar contra FAQ o PDF de costos.
  - name: Finsus
    institution_type: sofipo
    tiers:
      - limit: .inf
        rate: 0.04  # PENDIENTE — estimado no confirmado

  # ── REVOLUT ──────────────────────────────────────────────────────────────────
  # Fuente T&C: https://cdn.revolut.com/terms_and_conditions/pdf/t_rminos_y_condiciones_de_promociones_en_rendimientos_diarios_72a96081_3.0.0_1782166917_es.pdf
  # "Revolut Bank, S.A., Institución de Banca Múltiple" — cobertura IPAB hasta 400,000 UDIs.
  # Vigencia: 23 jun 2026 (clientes nuevos) / 23 jul 2026 (clientes existentes).
  # Estructura escalonada 3 tramos: $0–$25k / $25k–$1M / $1M+
  # Todos los planes pagan 15% en el primer tramo ($0.01–$25,000 MXN).
  # Plan Estándar: el 15% es CONDICIONAL — requiere 4 txns ≥$50 + wallet digital c/30 días (T&C §1).
  # Planes Premium y Metal: el 15% es automático por tener el plan.
  # Costos: Premium $1,788/año + IVA ($172.84/mes) | Metal $4,188/año + IVA ($404.84/mes).
  - name: Revolut
    institution_type: banco
    plans:
      - plan_key: standard
        display_name: Revolut Standard
        monthly_cost: 0
        tiers:
          - limit: 25_000
            rate: 0.15
            constraints:
              - type: transaction_count   # 4 compras ≥$50 c/u con tarjeta Revolut en 30 días
                min_transactions: 4
                min_amount_per_transaction: 50.0
                period_days: 30
                benefit: promo_15_rate
                active: true
              - type: digital_wallet      # tarjeta Revolut agregada en Google Wallet o Apple Pay
                benefit: promo_15_rate
                active: true
          - limit: 1_000_000
            rate: 0.07
          - limit: .inf
            rate: 0.045

      - plan_key: premium
        display_name: Revolut Premium
        monthly_cost: 172.84  # $1,788/año + IVA 16% / 12
        tiers:
          - limit: 25_000
            rate: 0.15
          - limit: 1_000_000
            rate: 0.073
          - limit: .inf
            rate: 0.048

      - plan_key: metal
        display_name: Revolut Metal
        monthly_cost: 404.84  # $4,188/año + IVA 16% / 12
        tiers:
          - limit: 25_000
            rate: 0.15
          - limit: 1_000_000
            rate: 0.075
          - limit: .inf
            rate: 0.05

  # ── MIFEL ────────────────────────────────────────────────────────────────────
  # Fuente: pendiente URL T&C (503/403 en mifel.com.mx/terminos)
  # "Banco Mifel S.A." — cobertura IPAB. Tasas T&C PDF Jun 2026.
  - name: Mifel
    institution_type: banco
    tiers:
      - limit: 99.99      # saldo < $100 no genera rendimiento
        rate: 0.0
      - limit: 500_000    # 10% hasta $500k
        rate: 0.10
      - limit: .inf
        rate: 0.0001      # 0.01% sobre $500k
