# Cambios de tasas curados manualmente — solo aparecen cuando se conoce la fecha
# efectiva oficial de la institución (vigente_desde).
# Tasas en fracción decimal anual (0.13 = 13%).
#
# Formato por entrada:
#   institution:    nombre tal como aparece en la UI
#   effective_from: fecha en que el cambio entró en vigor (YYYY-MM-DD)
#   descripcion:    narrativa del cambio — qué pasó y por qué importa
#   source:         URL o documento fuente
#   cambios:        lista de tramos afectados
#     - tier:       número de tramo (1 = primero)
#       old_rate:   tasa anterior
#       new_rate:   tasa nueva

entries:
  - institution: OpenBank
    effective_from: "2026-03-10"
    source: "T&C Openbank México — publicación mar 2026"
    descripcion: >
      Reestructuración de tramos: OpenBank sustituyó su tasa plana de 9%
      por un esquema escalonado de tres tramos. El tramo primario (hasta ~$499,999 MXN)
      subió a 13%; los tramos de saldos mayores quedaron en tasas menores.
      El cambio coincidió con el lanzamiento formal de OpenBank en México.
    cambios:
      - tier: 1
        old_rate: 0.09
        new_rate: 0.13
      - tier: 2
        old_rate: 0.09
        new_rate: 0.073
      - tier: 3
        old_rate: 0.09
        new_rate: 0.07

  - institution: Plata
    effective_from: "2026-05-07"
    source: "T&C Banco Plata — actualización may 2026"
    descripcion: >
      Reducción en Ahorro Plata+: la tasa con membresía bajó de 12% a 10%.
      La membresía Plata+ cuesta $114.84/mes ($99 + IVA). El punto de quiebre
      para que convenga sobre la cuenta sin membresía (7%) está en ~$45,936 MXN.
    cambios:
      - tier: 1
        old_rate: 0.12
        new_rate: 0.10
