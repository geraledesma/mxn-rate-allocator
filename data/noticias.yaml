# Cambios de tasas verificados con fuente primaria oficial (email institucional o T&C).
# Solo aparecen cuando se conoce la fecha efectiva confirmada por la institución.
# Tasas en fracción decimal anual (0.13 = 13%).
#
# Formato por entrada:
#   institution:    nombre como aparece en la UI
#   effective_from: fecha en que el cambio entró en vigor (YYYY-MM-DD)
#   descripcion:    narrativa concisa del cambio — qué pasó
#   source:         fuente primaria verificada
#   cambios:        tramos afectados
#     - tier:       número de tramo (1 = primero)
#       old_rate:   tasa anterior
#       new_rate:   tasa nueva

entries:
  - institution: OpenBank
    effective_from: "2026-03-10"
    source: "Email oficial OpenBank — 'Subimos el rendimiento de tu Apartado Open', mar 2026"
    descripcion: >
      Apartado Open subió de tasa plana de 9% a esquema escalonado:
      13% en los primeros $40,000 MXN, 7.30% de $40,001 a $1,000,000,
      y 7.00% a partir de $1,000,000.
    cambios:
      - tier: 1
        old_rate: 0.09
        new_rate: 0.13
      - tier: 2
        old_rate: 0.09
        new_rate: 0.073
      - tier: 3
        old_rate: 0.09
        new_rate: 0.07

  - institution: Plata
    effective_from: "2026-05-07"
    source: "Email oficial Banco Plata — 'Actualización de tasas de Ahorro Flexible y Fijo', may 2026"
    descripcion: >
      Plata reduce la tasa de Ahorro Flexible con membresía Plata+
      a 10% anual (GAT nominal 10.47%). Las tasas sin membresía no cambian.
    cambios:
      - tier: 1
        old_rate: 0.12
        new_rate: 0.10
